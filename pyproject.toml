[project]
name = "novo_teste"
version = "0.1.0"
description = "novo_teste using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.8.1"
]

[project.scripts]
novo_teste = "novo_teste.main:run"
run_crew = "novo_teste.main:run"
train = "novo_teste.main:train"
replay = "novo_teste.main:replay"
test = "novo_teste.main:test"
run_with_trigger = "novo_teste.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
